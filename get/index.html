<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Provexa</title>
<meta name="description" content="Download Provexa for iPhone or Android.">
<style>
  :root {
    --ink: #10161A;
    --paper: #F7F8F8;
    --rule: #D8DCDE;
    --muted: #5C666D;
    --accent: #E8B84B;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  main {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .mark {
    width: 72px;
    height: 72px;
    margin: 0 auto 28px;
    border-radius: 18px;
    background: var(--ink);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin: 0 0 10px;
  }

  .tagline {
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 36px;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  a.store {
    display: block;
    padding: 16px 20px;
    border-radius: 12px;
    background: var(--ink);
    color: #FFFFFF;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    border: 1px solid var(--ink);
    transition: opacity 0.15s ease;
  }

  a.store.secondary {
    background: transparent;
    color: var(--ink);
    border-color: var(--rule);
  }

  a.store:hover { opacity: 0.85; }

  a.store:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  .note {
    margin: 32px 0 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
  }

  .note a { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    a.store { transition: none; }
  }
</style>
</head>
<body>

<main>
  <div class="mark" aria-hidden="true">P</div>

  <h1>Provexa</h1>
  <p class="tagline">Track your workouts, set goals, and watch your progress build.</p>

  <div class="buttons">
    <a class="store" href="https://apps.apple.com/app/id6802147777">Download on the App&nbsp;Store</a>
    <a class="store secondary" href="https://play.google.com/store/apps/details?id=com.spotlessness.vantly">Get it on Google&nbsp;Play</a>
  </div>

  <p class="note">Taking you to your app store automatically. If nothing happens, choose one above.</p>
</main>

<script>
(function () {
  var ua = navigator.userAgent || navigator.vendor || "";

  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);

  if (isIOS) {
    window.location.replace("https://apps.apple.com/app/id6802147777");
  } else if (isAndroid) {
    window.location.replace("https://play.google.com/store/apps/details?id=com.spotlessness.vantly");
  } else {
    var note = document.querySelector(".note");
    if (note) { note.textContent = "Provexa is available for iPhone and Android."; }
  }
})();
</script>

</body>
</html>
